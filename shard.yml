name: crystalize
version: 0.1.1

description: |
  Package a Ruby (Rails) application, taken from a git branch, into a single
  executable: relocatable Ruby + gems + application code precompiled to YARV
  bytecode, appended as a payload to a Crystal launcher. Secrets are read at
  runtime from an age-encrypted YAML file; Active Storage files can be kept
  clear or encrypted on disk.

authors:
  - Philippe Nénert <philippe@aloli.fr>

crystal: ">= 1.19.0"

license: MIT

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.7"

targets:
  crystalize:
    main: src/cli.cr
